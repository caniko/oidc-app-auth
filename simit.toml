[ci]
runtime = "nix"
runner = "ubuntu-24.04"
with_msrv = true
with_audit = true
with_docs = true
publish_crates = true
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
provider = "actions"
platform = "github"

[release.signing]
key = "818D507F1E62139F8A17EAA64623DEA06FDACFE1"

[release.codeberg]
repo = "caniko/oidc-app-auth"

[release.artifacts]
runner = "atlas-nix-trusted"
build_commands = [
  "mkdir -p release",
  "rm -f release/oidc-app-auth-*.crate",
  "nix develop -c cargo package --locked",
  "cp target/package/oidc-app-auth-*.crate release/",
]
sign = false
